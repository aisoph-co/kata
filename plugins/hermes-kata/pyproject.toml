[project]
name = "hermes-kata"
version = "0.1.0"
description = "Hermes plugin: the Hermes-side adapter for the Kata learning service."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_kata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
