[project]
name = "learning-service"
version = "1.2.1"
description = "Kata learning service — Stage 0 core (identity, roster, curriculum, concept graph, learning engine, grading, team analytics, privacy)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "fsrs>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["learning_service*"]

[tool.setuptools.package-data]
# `fixtures/ferry/` is read at runtime via importlib.resources, not imported
# as Python — without this, a built wheel drops it. Shared by CI1's (KATA-13)
# ingestion grounding source (*.jsonl, *.md) and KATA-4's demo-seed scenario
# (*.json, plus the *.jsonl review log).
learning_service = [
    "fixtures/ferry/*.json",
    "fixtures/ferry/*.jsonl",
    "fixtures/ferry/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
